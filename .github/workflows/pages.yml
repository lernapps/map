name: Pages

# The map is retired: lernapps/apps (https://lernapps.net/apps/) replaces it for finding apps.
# /map/ and every path below it forward to /apps/ (index.html, 404.html from redirect/).
# The JSON Schemas stay published at /map/schemas/ for anyone who already references them.
# Actions are pinned to full commit SHAs (same rule as mathe-karte, M-27); Dependabot bumps them.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Assemble the redirect and the schemas (into dist/)
        run: |
          mkdir -p dist/schemas
          cp redirect/index.html redirect/404.html dist/
          cp schemas/generated/*.json dist/schemas/
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.ref == 'refs/heads/main'
        with:
          path: dist

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: check
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
