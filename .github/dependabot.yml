version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    groups:
      all:
        patterns: ["*"]
    ignore:
      # vue-tsc supports TypeScript majors only after a delay; bump by hand.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
